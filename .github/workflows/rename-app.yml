# ONE-TIME workflow: renames the generated android/ and windows/ projects from
# "unified_inbox" to "Nudge" (display name) / app.nudge.nudge (Android id).
# Safe to run again: it only changes what still has the old name.
name: Rename app to Nudge

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rename
        run: |
          set -euo pipefail
          OLD_PKG='app.unifiedinbox.unified_inbox'
          NEW_PKG='app.nudge.nudge'
          OLD_DIR='android/app/src/main/kotlin/app/unifiedinbox/unified_inbox'
          NEW_DIR='android/app/src/main/kotlin/app/nudge/nudge'

          # Android: application id / namespace and Kotlin package
          grep -rl "$OLD_PKG" android | xargs -r sed -i "s/$OLD_PKG/$NEW_PKG/g"
          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$NEW_DIR"
            git mv "$OLD_DIR"/* "$NEW_DIR"/
            rm -rf android/app/src/main/kotlin/app/unifiedinbox
          fi
          sed -i 's/android:label="unified_inbox"/android:label="Nudge"/' android/app/src/main/AndroidManifest.xml

          # Windows: window title, resources, binary name
          sed -i 's/L"unified_inbox"/L"Nudge"/' windows/runner/main.cpp
          sed -i -e 's/unified_inbox\.exe/nudge.exe/g' -e 's/unified_inbox/Nudge/g' windows/runner/Runner.rc
          sed -i 's/unified_inbox/nudge/g' windows/CMakeLists.txt

          echo "Remaining references to the old name:"
          grep -rn "unified_inbox\|unifiedinbox" android windows -I || echo "none"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: rename app to Nudge (android id app.nudge.nudge)"
          git push
      - name: Run CI on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
