# One-time workflow: generates android/ and windows/ folders (normally done
# locally by `flutter create`), formats the code, commits the result to the
# branch it was run on, then analyzes and tests.
name: Bootstrap platforms

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.0'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create . --platforms=android,windows --project-name unified_inbox --org app.unifiedinbox
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format .
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: generate android/windows platform folders and format"
          git push
      - run: flutter analyze
      - run: flutter test
