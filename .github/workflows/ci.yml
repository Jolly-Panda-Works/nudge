name: CI

# Every push builds the Android APK and the Windows app.
#   main        -> a permanent GitHub release  v<MAJOR.MINOR.<run number>>
#   tag v*.*.*  -> a permanent GitHub release with exactly that version
#   any branch  -> files stay in the run's artifacts (version ...-dev.<run>)
# Builds do not wait for the tests: a red test never blocks the outputs.
# The android/ and windows/ projects do not have to be committed: when they
# are missing, the build generates them with `flutter create` and applies
# tools/wire_capture.py (service, share target, file picker, display name).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running build: it may be in the middle of publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.0'

jobs:
  # ---------------------------------------------------------------- version
  # Pull requests from this repository are already covered by the push run.
  version:
    if: ${{ !(github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.v.outputs.kind }}
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
      asset_base: ${{ steps.v.outputs.asset_base }}
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide the version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          pubver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          major_minor=$(echo "$pubver" | cut -d. -f1-2)
          run="$GITHUB_RUN_NUMBER"
          short="${GITHUB_SHA::7}"
          slug=$(echo "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
              exit 1
            fi
            kind=tag
            version="${GITHUB_REF_NAME#v}"
            build_name=$(echo "$version" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            asset_base="Nudge_v${version}"
            release_tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            kind=main
            version="${major_minor}.${run}"
            build_name="$version"
            asset_base="Nudge_v${version}"
            release_tag="v${version}"
          else
            kind=branch
            version="${major_minor}.0-dev.${run}"
            build_name="${major_minor}.0"
            asset_base="Nudge_v${version}_${slug}-${short}"
            release_tag=""
          fi

          {
            echo "kind=$kind"
            echo "version=$version"
            echo "build_name=$build_name"
            echo "asset_base=$asset_base"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version ($kind), files named $asset_base" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- analyze and test
  verify:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The Format workflow fixes formatting on main; this only reports it.
      - name: Check formatting (report only)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .
      - run: dart run build_runner build
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # ---------------------------------------------------------------- Android
  android:
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      ASSET_BASE: ${{ needs.version.outputs.asset_base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Prepare the Android project
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            echo "Generating the Android project (it is not committed)."
            flutter create . --platforms=android --project-name nudge --org com.jollypanda
            rm -f test/widget_test.dart
          fi
          python3 tools/wire_capture.py --only android
          echo "---- AndroidManifest.xml after wiring ----"
          cat android/app/src/main/AndroidManifest.xml
      # A debug key that survives between runs, so that every build can be
      # installed over the previous one. Without it CI makes a new debug key
      # on each run and Android refuses the update ("package conflicts").
      - name: Restore the debug key
        uses: actions/cache@v4
        with:
          path: ~/.nudge-debug-key
          key: nudge-debug-key-v1
      # The release key lives in repository secrets (see docs/RELEASING.md).
      # Without them the APKs are signed with the debug key.
      - name: Prepare the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.NUDGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUDGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUDGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUDGE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nudge-release.jks"
            {
              echo "NUDGE_KEYSTORE_PATH=$RUNNER_TEMP/nudge-release.jks"
              echo "NUDGE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NUDGE_KEY_ALIAS=$KEY_ALIAS"
              echo "NUDGE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key." >> "$GITHUB_STEP_SUMMARY"
          else
            # No release key: use the debug key kept in the cache (created on
            # the first run). It is not secret; it only keeps updates working.
            if [ ! -f "$HOME/.nudge-debug-key/debug.jks" ]; then
              mkdir -p "$HOME/.nudge-debug-key"
              keytool -genkeypair -keystore "$HOME/.nudge-debug-key/debug.jks" \
                -storetype PKCS12 -alias nudge-debug -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass nudgedebug -keypass nudgedebug \
                -dname "CN=Nudge debug, O=Jolly Panda Works"
              echo "Created a new debug key (the cache had none)." >> "$GITHUB_STEP_SUMMARY"
            fi
            {
              echo "NUDGE_KEYSTORE_PATH=$HOME/.nudge-debug-key/debug.jks"
              echo "NUDGE_KEYSTORE_PASSWORD=nudgedebug"
              echo "NUDGE_KEY_ALIAS=nudge-debug"
              echo "NUDGE_KEY_PASSWORD=nudgedebug"
            } >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release key in the repository secrets; signing with the shared debug key."
          fi
      # A release build, split per CPU architecture: a debug APK carries every
      # architecture, debug tooling and unoptimized code, which is why it is
      # around 140 MB. Without a keystore it is signed with the debug key.
      - name: Build the release APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm64,android-arm
          --build-name="$BUILD_NAME"
          --build-number="$GITHUB_RUN_NUMBER"
          --dart-define=NUDGE_VERSION="$VERSION"
      - name: Name the output
        run: |
          mkdir -p dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk" "dist/${ASSET_BASE}_android-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/${ASSET_BASE}_android-armeabi-v7a.apk"
          ls -l dist
      - name: Show the signing certificate
        continue-on-error: true
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "dist/${ASSET_BASE}_android-arm64-v8a.apk" | grep -E "Signer #1 certificate (DN|SHA-256)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Describe the APKs
        continue-on-error: true
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in dist/*.apk; do
            {
              echo "### $(basename "$apk") ($(du -h "$apk" | cut -f1))"
              "$aapt2" dump badging "$apk" | grep -E "^(package:|sdkVersion|targetSdkVersion|native-code)" || true
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nudge-android
          path: dist/*.apk
          retention-days: ${{ github.ref_name == 'main' && 30 || 14 }}

  # ---------------------------------------------------------------- Windows
  windows:
    needs: version
    # Pinned to the VS2022 image; windows-latest moved to a VS2026 image.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      ASSET_BASE: ${{ needs.version.outputs.asset_base }}
    steps:
      - uses: actions/checkout@v7
      # flutter-action could not resolve 3.35.0 on Windows, so install the
      # exact release tag from git instead of using the release manifest.
      - name: Install Flutter (git tag)
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git C:/flutter
          echo "C:/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Prepare the Windows project
        run: |
          if [ ! -f windows/CMakeLists.txt ]; then
            echo "Generating the Windows project (it is not committed)."
            flutter create . --platforms=windows --project-name nudge --org com.jollypanda
            rm -f test/widget_test.dart
          fi
          PY=$(command -v python3 || command -v python)
          "$PY" tools/wire_capture.py --only windows
      - name: Build the Windows app
        run: >-
          flutter build windows --release
          --build-name="$BUILD_NAME"
          --build-number="$GITHUB_RUN_NUMBER"
          --dart-define=NUDGE_VERSION="$VERSION"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$($env:ASSET_BASE)_windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nudge-windows
          path: dist/*.zip
          retention-days: ${{ github.ref_name == 'main' && 30 || 14 }}

  # ---------------------------------------------------------------- release
  # main and version tags publish a permanent release. It is created as soon
  # as the Android build succeeds; the Windows zip is attached when it exists.
  release:
    needs: [version, android, windows]
    if: >-
      ${{ !cancelled()
      && needs.android.result == 'success'
      && (needs.version.outputs.kind == 'main' || needs.version.outputs.kind == 'tag') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      SIGNED: ${{ needs.android.outputs.signed }}
      KIND: ${{ needs.version.outputs.kind }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nudge-*
          merge-multiple: true
          path: dist
      - name: Publish the release
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS.txt)

          if [ "$SIGNED" = "true" ]; then
            signing="Signed with the Nudge release key."
          else
            signing="Signed with a shared debug key, for testing only (updates install over each other)."
          fi
          notes="Build of ${GITHUB_SHA::7}. $signing Install the arm64-v8a APK on any recent phone; armeabi-v7a is for old 32-bit devices."
          if [ "$WINDOWS_RESULT" != "success" ]; then
            notes="$notes The Windows build did not succeed in this run, so there is no Windows file."
          fi
          # Releases of a tag you pushed yourself are kept; the rest are pruned.
          if [ "$KIND" = "tag" ]; then
            notes="$notes <!-- nudge-keep -->"
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # The release already exists (for example drafted in the GitHub UI).
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Nudge v${VERSION}" \
              --notes "$notes" \
              --generate-notes \
              --latest
          fi

          # Keep only the newest release: delete every other release and its
          # tag, except those marked as kept (named version tags) and the one
          # just published. A failure here never fails the build.
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$RELEASE_TAG" ] && continue
            if gh release view "$tag" --json body --jq .body | grep -q 'nudge-keep'; then
              continue
            fi
            echo "Deleting old release $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done || true

          # Migration: the rolling "nightly" release was replaced by per-build releases.
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
