# Formats all Dart code with the pinned Flutter version, commits the result and
# starts CI on the new commit (commits made with GITHUB_TOKEN do not trigger
# workflows by themselves, but workflow_dispatch is allowed).
name: Format code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FLUTTER_VERSION: '3.35.0'

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - name: Commit formatting changes
        id: fmt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "style: dart format"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run CI on the formatted commit
        if: steps.fmt.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
