# Formats all Dart code with the pinned Flutter version and commits the result.
# Needed because the code is written without a local Flutter installation.
# The commit is formatting only, so it does not start another build.
name: Format code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.0'

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to format."
          else
            git commit -m "style: dart format"
            git push || echo "The branch moved while formatting; it will be formatted again on the next push."
          fi
