name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste real notification content, tokens or personal data.
  - type: input
    id: version
    attributes:
      label: Nudge version
      placeholder: "0.5.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, Windows]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, Android version and manufacturer skin (Android only)
      placeholder: "Samsung Galaxy S23, Android 15, One UI 7"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
