name: nudge
description: Nudge - unified notifications inbox, tasks and calendar (Android + Windows).
publish_to: 'none'
repository: https://github.com/Usef-Farahmand/nudge
issue_tracker: https://github.com/Usef-Farahmand/nudge/issues
version: 0.5.1+9

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.0
  drift_dev: ^2.26.0

flutter:
  uses-material-design: true
